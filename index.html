<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BiteLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BiteLog</title>
<style>
  :root {
    --bg: #f2f4f3;
    --card: #ffffff;
    --text: #1b2420;
    --muted: #6b7772;
    --accent: #2e9e6a;
    --danger: #d64545;
    --line: #e3e8e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513;
      --card: #1b221f;
      --text: #eef3f0;
      --muted: #94a19b;
      --accent: #43c287;
      --danger: #ff6b6b;
      --line: #2a332f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  header { padding: 20px 4px 8px; }
  header h1 { margin: 0; font-size: 32px; }
  header p { margin: 2px 0 0; color: var(--muted); }

  .total {
    background: var(--card); border-radius: 16px; padding: 16px;
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 12px 0 16px;
  }
  .total span { color: var(--muted); }
  .total strong { font-size: 26px; }

  .meal { background: var(--card); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
  .meal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  .meal-head small { color: var(--muted); font-weight: 500; font-size: 14px; }
  .entry {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .entry .info { flex: 1; min-width: 0; }
  .entry .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .portion { color: var(--muted); font-size: 13px; }
  .entry .kcal { color: var(--muted); white-space: nowrap; }
  .del {
    border: 0; background: none; color: var(--danger); font-size: 20px;
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  }
  .add {
    width: 100%; border: 0; background: none; color: var(--accent);
    font-size: 16px; font-weight: 600; padding: 14px 16px; text-align: left; cursor: pointer;
  }
  .empty { padding: 12px 16px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }

  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 12px 8px; }

  /* Add-food sheet */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px);
    max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 20px; }
  .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .sheet input {
    width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .buttons { display: flex; gap: 10px; margin-top: 18px; }
  .buttons button {
    flex: 1; font-size: 17px; font-weight: 600; padding: 14px; border-radius: 12px;
    border: 0; cursor: pointer;
  }
  .btn-cancel { background: var(--bg); color: var(--text); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:disabled { opacity: .4; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Today</h1>
    <p id="dateLabel"></p>
  </header>

  <div class="total">
    <span>Eaten today</span>
    <strong id="totalKcal">0 kcal</strong>
  </div>

  <div id="meals"></div>

  <footer>BiteLog is a tracking tool, not medical advice.<br>All data stays on this device.</footer>
</main>

<div class="overlay" id="overlay">
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="sheetTitle">Add food</h2>
    <label for="fName">Name</label>
    <input id="fName" type="text" placeholder="e.g. Oatmeal" required>
    <label for="fPortion">Portion</label>
    <input id="fPortion" type="text" placeholder="e.g. 60 g">
    <label for="fCal">Calories (kcal)</label>
    <input id="fCal" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 230" required>
    <label>Optional (grams)</label>
    <div class="row3">
      <input id="fProtein" type="text" inputmode="decimal" placeholder="Protein">
      <input id="fCarbs" type="text" inputmode="decimal" placeholder="Carbs">
      <input id="fFat" type="text" inputmode="decimal" placeholder="Fat">
    </div>
    <div class="buttons">
      <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn-save" id="saveBtn" disabled>Save</button>
    </div>
  </form>
</div>

<script>
(function () {
  "use strict";

  var MEALS = [
    { id: "breakfast", label: "Breakfast", icon: "🌅" },
    { id: "lunch",     label: "Lunch",     icon: "☀️" },
    { id: "dinner",    label: "Dinner",    icon: "🌙" },
    { id: "snacks",    label: "Snacks",    icon: "🥕" }
  ];
  var KEY = "bitelog.entries.v1";

  // ---------- storage ----------
  function loadEntries() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function saveEntries(list) {
    localStorage.setItem(KEY, JSON.stringify(list));
  }
  var entries = loadEntries();

  // ---------- helpers ----------
  function todayKey() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function numOrNull(text) {
    var t = String(text).replace(",", ".").trim();
    if (t === "") return null;
    var n = parseFloat(t);
    return isNaN(n) ? null : n;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---------- render ----------
  function render() {
    var today = todayKey();
    var todays = entries.filter(function (e) { return e.date === today; });

    document.getElementById("dateLabel").textContent =
      new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
    document.getElementById("totalKcal").textContent =
      todays.reduce(function (s, e) { return s + e.calories; }, 0) + " kcal";

    var root = document.getElementById("meals");
    root.textContent = "";

    MEALS.forEach(function (meal) {
      var list = todays.filter(function (e) { return e.meal === meal.id; });
      var sum = list.reduce(function (s, e) { return s + e.calories; }, 0);

      var card = el("section", "meal");
      var head = el("div", "meal-head");
      head.appendChild(el("span", "", meal.icon + " " + meal.label));
      head.appendChild(el("small", "", sum + " kcal"));
      card.appendChild(head);

      if (list.length === 0) {
        card.appendChild(el("div", "empty", "Nothing logged yet"));
      }
      list.forEach(function (entry) {
        var row = el("div", "entry");
        var info = el("div", "info");
        info.appendChild(el("div", "name", entry.name));
        if (entry.portion) info.appendChild(el("div", "portion", entry.portion));
        row.appendChild(info);
        row.appendChild(el("div", "kcal", entry.calories + " kcal"));
        var del = el("button", "del", "✕");
        del.type = "button";
        del.setAttribute("aria-label", "Delete " + entry.name);
        del.addEventListener("click", function () {
          if (confirm("Delete \"" + entry.name + "\"?")) removeEntry(entry.id);
        });
        row.appendChild(del);
        card.appendChild(row);
      });

      var add = el("button", "add", "＋ Add food");
      add.type = "button";
      add.addEventListener("click", function () { openSheet(meal); });
      card.appendChild(add);

      root.appendChild(card);
    });
  }

  function removeEntry(id) {
    entries = entries.filter(function (e) { return e.id !== id; });
    saveEntries(entries);
    render();
  }

  // ---------- add-food sheet ----------
  var overlay = document.getElementById("overlay");
  var form = document.getElementById("form");
  var fName = document.getElementById("fName");
  var fPortion = document.getElementById("fPortion");
  var fCal = document.getElementById("fCal");
  var fProtein = document.getElementById("fProtein");
  var fCarbs = document.getElementById("fCarbs");
  var fFat = document.getElementById("fFat");
  var saveBtn = document.getElementById("saveBtn");
  var currentMeal = null;

  function validate() {
    var okName = fName.value.trim() !== "";
    var okCal = /^\d+$/.test(fCal.value.trim());
    saveBtn.disabled = !(okName && okCal);
  }
  [fName, fCal].forEach(function (i) { i.addEventListener("input", validate); });

  function openSheet(meal) {
    currentMeal = meal;
    document.getElementById("sheetTitle").textContent = "Add to " + meal.label;
    form.reset();
    validate();
    overlay.classList.add("open");
    setTimeout(function () { fName.focus(); }, 50);
  }
  function closeSheet() { overlay.classList.remove("open"); }

  document.getElementById("cancelBtn").addEventListener("click", closeSheet);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (saveBtn.disabled) return;
    entries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: todayKey(),
      meal: currentMeal.id,
      name: fName.value.trim(),
      portion: fPortion.value.trim(),
      calories: parseInt(fCal.value.trim(), 10),
      protein: numOrNull(fProtein.value),
      carbs: numOrNull(fCarbs.value),
      fat: numOrNull(fFat.value)
    });
    saveEntries(entries);
    closeSheet();
    render();
  });

  // Refresh when the app comes back to the foreground (e.g. after midnight)
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });

  render();

  // ---------- offline support ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
