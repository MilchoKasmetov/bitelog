<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BiteLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BiteLog</title>
<style>
  :root {
    --bg: #f2f4f3;
    --card: #ffffff;
    --text: #1b2420;
    --muted: #6b7772;
    --accent: #2e9e6a;
    --danger: #d64545;
    --warn: #d9822b;
    --water: #3b8fd9;
    --line: #e3e8e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513;
      --card: #1b221f;
      --text: #eef3f0;
      --muted: #94a19b;
      --accent: #43c287;
      --danger: #ff6b6b;
      --warn: #f0a04b;
      --water: #5aa9f0;
      --line: #2a332f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }
  header { padding: 20px 4px 8px; }
  header h1 { margin: 0; font-size: 32px; }
  header p { margin: 2px 0 0; color: var(--muted); }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .card h3 { margin: 0 0 10px; font-size: 17px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  p { line-height: 1.4; }
  .kv {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { font-weight: 600; text-align: right; }
  .note {
    background: rgba(217,130,43,.13); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; margin: 8px 0; line-height: 1.4;
  }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
    padding: 14px; cursor: pointer; margin-top: 12px;
  }
  .btn.secondary { background: var(--bg); color: var(--text); }
  .btn.danger { background: none; color: var(--danger); border: 1px solid var(--danger); }

  /* Ring */
  .ring-card { text-align: center; }
  .ring-wrap { position: relative; width: 190px; height: 190px; margin: 4px auto 12px; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--line); stroke-width: 14; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; }
  .ring-fg.over { stroke: var(--warn); }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .ring-center strong { font-size: 34px; line-height: 1.1; }
  .ring-center strong.over { color: var(--warn); }
  .ring-center span { color: var(--muted); font-size: 13px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats3 b { display: block; font-size: 18px; }
  .stats3 span { font-size: 12px; color: var(--muted); }

  /* Meals */
  .meal { background: var(--card); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
  .meal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  .meal-head small { color: var(--muted); font-weight: 500; font-size: 14px; }
  .entry {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .entry .info { flex: 1; min-width: 0; }
  .entry .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .portion { color: var(--muted); font-size: 13px; }
  .entry .kcal { color: var(--muted); white-space: nowrap; }
  .del {
    border: 0; background: none; color: var(--danger); font-size: 20px;
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  }
  .add {
    width: 100%; border: 0; background: none; color: var(--accent);
    font-size: 16px; font-weight: 600; padding: 14px 16px; text-align: left; cursor: pointer;
  }
  .empty { padding: 12px 16px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }

  /* Week + progress */
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .weeknav button {
    border: 0; background: var(--card); color: var(--text);
    width: 46px; height: 46px; border-radius: 12px; font-size: 22px; cursor: pointer;
  }
  .weeknav button:disabled { opacity: .35; }
  .weeknav div { text-align: center; font-weight: 600; }
  .weeknav div small { display: block; color: var(--muted); font-weight: 500; }
  .track { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 10px 0 8px; }
  .fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .triple { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .triple b { display: block; color: var(--text); font-size: 15px; }
  .triple div:nth-child(2) { text-align: center; }
  .triple div:last-child { text-align: right; }

  svg.chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; font-family: inherit; }
  .chart .today-label { font-weight: 700; fill: var(--text); }
  .chart .val { fill: var(--text); font-size: 9px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--accent); }
  .chart .bar-over { fill: var(--warn); }
  .chart .goal { stroke: var(--text); stroke-width: 1; stroke-dasharray: 4 3; opacity: .6; }
  .chart .tgt { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .chart .wline { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 1.5; }

  .wrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .wrow:last-child { border-bottom: 0; }
  .wrow .d { flex: 1; color: var(--muted); }
  .wrow .v { font-weight: 600; }

  /* Forms */
  .seg { display: flex; gap: 3px; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: none; color: var(--text);
    padding: 11px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #fff; }
  .field { margin: 12px 0; }
  .field > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }

  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 12px 8px; }

  /* Water, sweets, exercise */
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-head h3 { margin: 0 0 10px; }
  .fill.water { background: var(--water); }
  .fill.over { background: var(--warn); }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row button {
    flex: 1; border: 0; border-radius: 12px; background: var(--bg); color: var(--text);
    padding: 12px 4px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-row button.primary { background: var(--water); color: #fff; }
  .btn-row button:disabled { opacity: .4; }
  .limit { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .limit .track { margin: 4px 0 6px; height: 8px; }
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
  .stats4 b { display: block; font-size: 17px; }
  .stats4 span { font-size: 12px; color: var(--muted); }
  .seg.metric button { font-size: 14px; padding: 10px 2px; }
  .chart .bar-water { fill: var(--water); }
  .chart .bar-water-dim { fill: var(--water); opacity: .4; }

  /* Sharing */
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 16px; }
  .check input { width: 22px; height: 22px; flex: none; }
  .btn-row.share button.primary { background: var(--accent); }
  .linkbox {
    display: block; width: 100%; margin-top: 12px; font-size: 12px; padding: 10px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); word-break: break-all; font-family: inherit;
  }
  .sday { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sday:last-child { border-bottom: 0; }
  .sday-head { display: flex; justify-content: space-between; font-weight: 600; }
  .smeal { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .smeal b { color: var(--text); font-weight: 600; }

  /* Tab bar */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button {
    flex: 1; border: 0; background: none; color: var(--muted);
    padding: 8px 0 7px; font-size: 11px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tabs button .ti { font-size: 21px; line-height: 1.1; }
  .tabs button.on { color: var(--accent); }

  /* Sheets */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px);
    max-height: 92vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 20px; }
  .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .sheet input {
    width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .sheet .field > label { margin: 0 0 4px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .buttons { display: flex; gap: 10px; margin-top: 18px; }
  .buttons button {
    flex: 1; font-size: 17px; font-weight: 600; padding: 14px; border-radius: 12px;
    border: 0; cursor: pointer;
  }
  .btn-cancel { background: var(--bg); color: var(--text); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:disabled { opacity: .4; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px);
    transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 11px 16px; border-radius: 12px; font-size: 14px; max-width: 90%;
    text-align: center; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<main>
  <section id="view-today" class="view"></section>
  <section id="view-week" class="view" hidden></section>
  <section id="view-weight" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
  <section id="view-shared" class="view" hidden></section>
  <footer>BiteLog is a tracking tool, not medical advice.<br>All data stays on this device.</footer>
</main>

<nav class="tabs" id="tabs">
  <button type="button" data-view="today" class="on"><span class="ti">📖</span><span>Today</span></button>
  <button type="button" data-view="week"><span class="ti">📅</span><span>Week</span></button>
  <button type="button" data-view="weight"><span class="ti">⚖️</span><span>Weight</span></button>
  <button type="button" data-view="settings"><span class="ti">⚙️</span><span>Settings</span></button>
</nav>

<!-- Add food sheet -->
<div class="overlay" id="overlay">
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="sheetTitle">Add food</h2>
    <label for="fName">Name</label>
    <input id="fName" type="text" placeholder="e.g. Oatmeal" required>
    <label for="fPortion">Portion</label>
    <input id="fPortion" type="text" placeholder="e.g. 60 g">
    <label for="fCal">Calories (kcal)</label>
    <input id="fCal" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 230" required>
    <div id="sugarWrap" hidden>
      <label for="fSugar">Sugar (grams, optional)</label>
      <input id="fSugar" type="text" inputmode="decimal" placeholder="e.g. 18">
    </div>
    <div id="macroWrap">
      <label>Optional (grams)</label>
      <div class="row3">
        <input id="fProtein" type="text" inputmode="decimal" placeholder="Protein">
        <input id="fCarbs" type="text" inputmode="decimal" placeholder="Carbs">
        <input id="fFat" type="text" inputmode="decimal" placeholder="Fat">
      </div>
    </div>
    <div class="buttons">
      <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn-save" id="saveBtn" disabled>Save</button>
    </div>
  </form>
</div>

<!-- Log weight sheet -->
<div class="overlay" id="wOverlay">
  <form class="sheet" id="wForm" autocomplete="off">
    <h2>Log weight</h2>
    <div class="field">
      <label for="wValue" id="wValueLabel">Weight</label>
      <input id="wValue" type="text" inputmode="decimal" placeholder="e.g. 82.4">
    </div>
    <div class="field">
      <label for="wDate">Date</label>
      <input id="wDate" type="date">
    </div>
    <div class="buttons">
      <button type="button" class="btn-cancel" id="wCancel">Cancel</button>
      <button type="submit" class="btn-save" id="wSave">Save</button>
    </div>
  </form>
</div>

<!-- Add workout sheet -->
<div class="overlay" id="xOverlay">
  <form class="sheet" id="xForm" autocomplete="off">
    <h2>Add workout</h2>
    <div class="field">
      <label for="xType">Activity</label>
      <select id="xType"></select>
    </div>
    <div class="field">
      <label for="xMin">Duration (minutes)</label>
      <input id="xMin" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 30">
    </div>
    <div class="field">
      <label for="xKcal">Calories burned (kcal)</label>
      <input id="xKcal" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 250">
      <div class="hint">Estimated from your weight and the activity. Replace it with your watch's number if you have one.</div>
    </div>
    <div class="buttons">
      <button type="button" class="btn-cancel" id="xCancel">Cancel</button>
      <button type="submit" class="btn-save" id="xSave" disabled>Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var MEALS = [
    { id: "breakfast", label: "Breakfast", icon: "🌅" },
    { id: "lunch",     label: "Lunch",     icon: "☀️" },
    { id: "dinner",    label: "Dinner",    icon: "🌙" },
    { id: "snacks",    label: "Snacks",    icon: "🥕" },
    { id: "sweets",    label: "Sweets",    icon: "🍰" }
  ];
  // MET values (rough effort levels) used to estimate calories burned
  var ACTIVITIES = [
    { id: "walking",  label: "Walking",          icon: "🚶", met: 3.8 },
    { id: "running",  label: "Running",          icon: "🏃", met: 9.8 },
    { id: "cycling",  label: "Cycling",          icon: "🚴", met: 7.0 },
    { id: "gym",      label: "Gym / strength",   icon: "🏋️", met: 4.5 },
    { id: "swimming", label: "Swimming",         icon: "🏊", met: 6.0 },
    { id: "yoga",     label: "Yoga / stretching", icon: "🧘", met: 2.5 },
    { id: "hiit",     label: "HIIT / aerobics",  icon: "🤸", met: 8.0 },
    { id: "hiking",   label: "Hiking",           icon: "🥾", met: 6.0 },
    { id: "sport",    label: "Team sport",       icon: "⚽", met: 7.0 },
    { id: "other",    label: "Other",            icon: "💪", met: 4.0 }
  ];
  var KEYS = {
    entries: "bitelog.entries.v1",
    profile: "bitelog.profile.v1",
    weights: "bitelog.weights.v1",
    water: "bitelog.water.v1",
    workouts: "bitelog.workouts.v1"
  };
  var LB = 2.2046226218;
  var DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var SVGNS = "http://www.w3.org/2000/svg";

  // ======================================================
  // Small helpers
  // ======================================================
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs, cls) {
    var e = document.createElementNS(SVGNS, tag);
    if (cls) e.setAttribute("class", cls);
    for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]); }
    return e;
  }
  function load(key, fallback) {
    try {
      var v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { toast("Could not save. Is your phone storage full?", true); }
  }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmt(n) { return Math.round(n).toLocaleString("en-GB"); }
  function round10(n) { return Math.round(n / 10) * 10; }
  function sumCal(list) { return list.reduce(function (s, e) { return s + e.calories; }, 0); }
  function num(text) {
    var t = String(text).replace(",", ".").trim();
    if (t === "") return NaN;
    return parseFloat(t);
  }
  function numOrNull(text) { var n = num(text); return isNaN(n) ? null : n; }
  function signed(v, digits) {
    var r = Math.abs(v).toFixed(digits);
    if (parseFloat(r) === 0) return r;
    return (v > 0 ? "+" : "−") + r;
  }
  function shortDate(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
  function longDate(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }

  var toastTimer = null;
  function toast(msg, isError) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast"; }, 3200);
  }

  // ======================================================
  // State
  // ======================================================
  var entries = load(KEYS.entries, []);
  var weights = load(KEYS.weights, []);
  var water = load(KEYS.water, {});          // { "2026-10-19": 1500 } millilitres per day
  var workouts = load(KEYS.workouts, []);    // [{ id, date, type, minutes, kcal }]
  if (!water || typeof water !== "object" || Array.isArray(water)) water = {};
  if (!Array.isArray(workouts)) workouts = [];
  function defaultProfile() {
    return {
      sex: null, age: null, heightCm: null, targetKg: null,
      activity: 1.2, pace: 0.5, customGoal: null, units: "kg", lastBackup: null,
      glassMl: 250, waterMl: 2000, sweetsLimit: null, eatBack: 0.5,
      waterAuto: true, waterPerKg: 35, shareName: ""
    };
  }
  var profile = Object.assign(defaultProfile(), load(KEYS.profile, {}));
  var weekOffset = 0;
  var currentView = "today";

  function saveProfile() { save(KEYS.profile, profile); }
  function sortWeights() {
    weights.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  }
  sortWeights();
  function latestWeight() { return weights.length ? weights[weights.length - 1] : null; }
  function weightOnOrBefore(key) {
    var found = null;
    weights.forEach(function (w) { if (w.date <= key) found = w; });
    return found;
  }
  function upsertWeight(date, kg) {
    var i;
    for (i = 0; i < weights.length; i++) {
      if (weights[i].date === date) { weights[i].kg = kg; sortWeights(); save(KEYS.weights, weights); return; }
    }
    weights.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: date, kg: kg });
    sortWeights();
    save(KEYS.weights, weights);
  }

  // Units (everything is stored in kg; shown in the unit the user picked)
  function unitLabel() { return profile.units === "lb" ? "lb" : "kg"; }
  function toDisp(kg) { return profile.units === "lb" ? kg * LB : kg; }
  function fromDisp(v) { return profile.units === "lb" ? v / LB : v; }
  function fmtW(kg, digits) { return toDisp(kg).toFixed(digits === undefined ? 1 : digits) + " " + unitLabel(); }

  // ======================================================
  // Calorie calculation (BMI, BMR, TDEE, recommended goal)
  // ======================================================
  function profileReady() {
    return !!(profile.sex && profile.age && profile.heightCm && profile.targetKg && latestWeight());
  }
  function bmiLabel(b) {
    if (b < 18.5) return "Underweight";
    if (b < 25) return "Healthy weight";
    if (b < 30) return "Overweight";
    return "Obesity";
  }

  function calc() {
    if (!profileReady()) return null;
    var w = latestWeight().kg;
    var hm = profile.heightCm / 100;
    var age = profile.age;
    var bmi = w / (hm * hm);

    // Mifflin-St Jeor equation: resting energy use per day
    var bmr = 10 * w + 6.25 * profile.heightCm - 5 * age + (profile.sex === "m" ? 5 : -161);
    var tdee = bmr * profile.activity;            // maintenance calories
    var floor = profile.sex === "m" ? 1500 : 1200; // lowest suggested intake
    var wantsLoss = w > profile.targetKg + 0.05;
    var notes = [];
    var deficit = 0;
    var mode = "maintain";

    if (age < 18) {
      notes.push("BiteLog's weight-loss goals are made for adults. At your age, please talk to a doctor before trying to lose weight. Your goal is set to maintenance.");
    } else if (bmi < 18.5) {
      notes.push("Your BMI is under 18.5, which counts as underweight. BiteLog will not suggest a calorie deficit, so your goal is set to maintenance. Please talk to a doctor.");
    } else if (wantsLoss) {
      mode = "loss";
      // 1 kg of body weight is roughly 7,700 kcal. Never cut more than 25% of maintenance.
      deficit = Math.min(profile.pace * 7700 / 7, tdee * 0.25);
    }

    var rec = tdee - deficit;
    if (mode === "loss" && rec < floor) {
      rec = Math.min(floor, tdee);
      notes.push("Your recommended goal was raised to " + fmt(floor) + " kcal, the lowest level we suggest without medical supervision.");
    }
    rec = round10(rec);

    var goal = rec;
    var custom = false;
    if (profile.customGoal) {
      goal = profile.customGoal;
      custom = true;
      if (goal < floor) notes.push("Your own goal of " + fmt(goal) + " kcal is below " + fmt(floor) + " kcal. Eating this little can be unsafe without medical supervision.");
      if (wantsLoss && goal >= tdee) notes.push("Your own goal is at or above your maintenance calories, so you would not lose weight.");
    }

    var perDay = tdee - goal;                // average daily deficit with the chosen goal
    var weeklyKg = perDay * 7 / 7700;        // expected change per week
    if (custom && weeklyKg > 1) notes.push("Your own goal means losing more than 1 kg per week, which is faster than usually recommended.");

    var targetBmi = profile.targetKg / (hm * hm);
    if (wantsLoss && age >= 18 && targetBmi < 18.5) {
      notes.push("Your target weight would give a BMI of " + targetBmi.toFixed(1) + ", which is underweight. Consider a target of at least " + fmtW(18.5 * hm * hm) + ".");
    }

    var weeks = (wantsLoss && weeklyKg > 0.05) ? (w - profile.targetKg) / weeklyKg : null;
    return {
      weightKg: w, bmi: bmi, bmr: bmr, tdee: tdee, floor: floor,
      mode: mode, rec: rec, goal: goal, custom: custom,
      perDay: perDay, weeklyKg: weeklyKg, targetBmi: targetBmi,
      healthyMin: 18.5 * hm * hm, healthyMax: 24.9 * hm * hm,
      weeks: weeks,
      eta: weeks === null ? null : addDays(new Date(), Math.round(weeks * 7)),
      wantsLoss: wantsLoss, notes: notes
    };
  }

  // ======================================================
  // Tabs
  // ======================================================
  function switchTo(name) {
    currentView = name;
    ["today", "week", "weight", "settings"].forEach(function (v) {
      $("view-" + v).hidden = (v !== name);
    });
    var btns = $("tabs").querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = btns[i].getAttribute("data-view") === name ? "on" : "";
    }
    if (name === "settings") renderSettings();
    else renderAll();
    window.scrollTo(0, 0);
  }
  $("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (b) switchTo(b.getAttribute("data-view"));
  });

  function renderAll() {
    renderToday();
    renderWeek();
    renderWeight();
  }

  // ======================================================
  // TODAY
  // ======================================================
  function ringEl(eaten, goal) {
    var R = 76, C = 2 * Math.PI * R;
    var wrap = el("div", "ring-wrap");
    var svg = svgEl("svg", { viewBox: "0 0 190 190", "aria-hidden": "true" });
    svg.appendChild(svgEl("circle", { cx: 95, cy: 95, r: R }, "ring-bg"));
    var over = eaten > goal;
    if (eaten > 0) {
      var frac = Math.min(eaten / goal, 1);
      var fg = svgEl("circle", { cx: 95, cy: 95, r: R, "stroke-dasharray": (frac * C).toFixed(1) + " " + C.toFixed(1) }, "ring-fg" + (over ? " over" : ""));
      svg.appendChild(fg);
    }
    wrap.appendChild(svg);
    var center = el("div", "ring-center");
    var left = goal - eaten;
    center.appendChild(el("strong", over ? "over" : "", fmt(Math.abs(left))));
    center.appendChild(el("span", "", over ? "kcal over goal" : "kcal left"));
    wrap.appendChild(center);
    wrap.setAttribute("role", "img");
    wrap.setAttribute("aria-label", fmt(eaten) + " of " + fmt(goal) + " kilocalories eaten");
    return wrap;
  }

  function entryRow(entry) {
    var row = el("div", "entry");
    var info = el("div", "info");
    info.appendChild(el("div", "name", entry.name));
    var bits = [];
    if (entry.portion) bits.push(entry.portion);
    if (entry.sugar) bits.push((Math.round(entry.sugar * 10) / 10) + " g sugar");
    if (bits.length) info.appendChild(el("div", "portion", bits.join(" · ")));
    row.appendChild(info);
    row.appendChild(el("div", "kcal", entry.calories + " kcal"));
    var del = el("button", "del", "✕");
    del.type = "button";
    del.setAttribute("aria-label", "Delete " + entry.name);
    del.addEventListener("click", function () {
      if (confirm("Delete \"" + entry.name + "\"?")) removeEntry(entry.id);
    });
    row.appendChild(del);
    return row;
  }

  function mealCard(meal, list, c) {
    var sum = sumCal(list);
    var isSweets = meal.id === "sweets";
    var card = el("section", "meal");
    var head = el("div", "meal-head");
    head.appendChild(el("span", "", meal.icon + " " + meal.label));
    var sugar = list.reduce(function (s, e) { return s + (e.sugar || 0); }, 0);
    head.appendChild(el("small", "", sum + " kcal" + (isSweets && sugar > 0 ? " · " + Math.round(sugar) + " g sugar" : "")));
    card.appendChild(head);

    if (isSweets) {
      var lim = sweetsLimit(c);
      if (lim) {
        var box = el("div", "limit");
        var track = el("div", "track");
        var fill = el("div", "fill" + (sum > lim ? " over" : ""));
        fill.style.width = Math.min(sum / lim * 100, 100).toFixed(0) + "%";
        track.appendChild(fill);
        box.appendChild(track);
        box.appendChild(document.createTextNode(sum > lim
          ? "Limit " + fmt(lim) + " kcal: " + fmt(sum - lim) + " over"
          : "Limit " + fmt(lim) + " kcal: " + fmt(lim - sum) + " left"));
        card.appendChild(box);
      }
    }
    if (list.length === 0) {
      card.appendChild(el("div", "empty", isSweets ? "No sweets logged. They also count in your daily calories." : "Nothing logged yet"));
    }
    list.forEach(function (entry) { card.appendChild(entryRow(entry)); });

    var add = el("button", "add", isSweets ? "＋ Add sweets" : "＋ Add food");
    add.type = "button";
    add.addEventListener("click", function () { openSheet(meal); });
    card.appendChild(add);
    return card;
  }

  function waterCard() {
    var key = todayKey();
    var ml = waterOn(key), target = waterTargetFor(key);
    var card = el("div", "card");
    var head = el("div", "card-head");
    head.appendChild(el("h3", "", "💧 Water"));

    card.appendChild(head);

    var track = el("div", "track");

    card.appendChild(track);

    if (profile.waterAuto && autoWaterMl(profile.waterPerKg)) {
      card.appendChild(el("p", "muted small", "Target: " + profile.waterPerKg + " ml per kg of your weight" +

    var big = el("button", "", "＋ 500 ml");

    big.addEventListener("click", function () { addWater(500); });

  function exerciseCard() {
    var list = workoutsOn(todayKey());
    var mins = list.reduce(function (s, w) { return s + w.minutes; }, 0);
    var kcal = list.reduce(function (s, w) { return s + w.kcal; }, 0);
    var card = el("section", "meal");
    var head = el("div", "meal-head");
    head.appendChild(el("span", "", "🏃 Exercise"));
    head.appendChild(el("small", "", list.length ? mins + " min · " + fmt(kcal) + " kcal burned" : "0 min"));
    card.appendChild(head);
    if (list.length === 0) card.appendChild(el("div", "empty", "No workouts yet today"));
    list.forEach(function (w) {
      var a = activityById(w.type);
      var row = el("div", "entry");

      info.appendChild(el("div", "portion", w.minutes + " min"));

  function renderToday() {
    var root = $("view-today");
    root.textContent = "";
    var today = todayKey();
    var todays = entries.filter(function (e) { return e.date === today; });
    var eaten = sumCal(todays);
    var c = calc();
    var burned = burnedOn(today);
    var bonus = bonusOn(today);

    var head = el("header");
    head.appendChild(el("h1", "", "Today"));
    head.appendChild(el("p", "", new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })));
    root.appendChild(head);

    var card = el("div", "card ring-card");
    if (c) {
      var budget = c.goal + bonus;
      card.appendChild(ringEl(eaten, budget));
      var stats = el("div", "stats4");
      [["Goal", fmt(c.goal)],
       ["Eaten", fmt(eaten)],
       ["Exercise", bonus > 0 ? "+" + fmt(bonus) : "0"],
       [eaten > budget ? "Over" : "Left", fmt(Math.abs(budget - eaten))]].forEach(function (s) {
        var d = el("div");
        d.appendChild(el("b", "", s[1]));
        d.appendChild(el("span", "", s[0]));
        stats.appendChild(d);
      });
      card.appendChild(stats);
      var cap = "All numbers are kcal.";
      if (burned > 0) {
        cap = profile.eatBack === 0
          ? "You burned about " + fmt(burned) + " kcal in workouts. It is not added to your budget (you can change this in Settings)."
          : "You burned about " + fmt(burned) + " kcal in workouts. " + Math.round(profile.eatBack * 100) + "% of it is added to today's budget.";
      }
      card.appendChild(el("p", "muted small", cap));
    } else {
      card.appendChild(el("p", "muted", "Eaten today"));
      card.appendChild(el("strong", "", fmt(eaten) + " kcal"));
      card.lastChild.style.fontSize = "30px";
      card.appendChild(el("p", "muted small", "Set up your profile to get a daily calorie goal and a progress ring."));
      var setup = el("button", "btn", "Set up my calorie goal");
      setup.type = "button";
      setup.addEventListener("click", function () { switchTo("settings"); });
      card.appendChild(setup);
    }
    root.appendChild(card);

    if (needsBackup()) {
      var bcard = el("div", "card");
      bcard.appendChild(el("p", "", "💾 " + (profile.lastBackup
        ? "It has been a while since your last backup."
        : "You have not saved a backup yet.") + " Your data lives only on this phone."));
      var bbtn = el("button", "btn secondary", "Save a backup");
      bbtn.type = "button";
      bbtn.addEventListener("click", function () {
        switchTo("settings");
        var dc = $("dataCard");
        if (dc && dc.scrollIntoView) dc.scrollIntoView();
      });
      bcard.appendChild(bbtn);
      root.appendChild(bcard);
    }

    root.appendChild(waterCard());

    MEALS.forEach(function (meal) {
      var list = todays.filter(function (e) { return e.meal === meal.id; });
      root.appendChild(mealCard(meal, list, c));
    });

    root.appendChild(exerciseCard());
  }

  function removeEntry(id) {
    entries = entries.filter(function (e) { return e.id !== id; });
    save(KEYS.entries, entries);
    renderAll();
  }

  // ======================================================
  // Shared progress card (start -> now -> target)
  // ======================================================
  function progressCard(c) {
    var card = el("div", "card");
    card.appendChild(el("h3", "", "Progress to target"));
    if (!c) {
      card.appendChild(el("p", "muted", "Fill in your profile and log your weight to see how you are moving toward your target."));
      var go = el("button", "btn secondary", "Open settings");
      go.type = "button";
      go.addEventListener("click", function () { switchTo("settings"); });
      card.appendChild(go);
      return card;
    }
    var cur = latestWeight().kg;
    var start = weights[0].kg;
    var target = profile.targetKg;

    if (start <= target + 0.05) {
      card.appendChild(el("p", "", "You are at or below your target weight of " + fmtW(target) + ". Your goal is set to maintenance."));
      return card;
    }
    var pct = Math.max(0, Math.min(100, (start - cur) / (start - target) * 100));
    var track = el("div", "track");
    var fill = el("div", "fill");
    fill.style.width = pct.toFixed(0) + "%";
    track.appendChild(fill);
    track.setAttribute("role", "progressbar");
    track.setAttribute("aria-valuenow", pct.toFixed(0));
    track.setAttribute("aria-valuemin", "0");
    track.setAttribute("aria-valuemax", "100");
    card.appendChild(track);

    var triple = el("div", "triple");
    [["Start", fmtW(start)], ["Now", fmtW(cur)], ["Target", fmtW(target)]].forEach(function (t) {
      var d = el("div");
      d.appendChild(el("b", "", t[1]));
      d.appendChild(document.createTextNode(t[0]));
      triple.appendChild(d);
    });
    card.appendChild(triple);

    var lost = start - cur;
    var togo = Math.max(cur - target, 0);
    var line = lost >= 0
      ? fmtW(lost) + " lost so far (" + pct.toFixed(0) + "%), " + fmtW(togo) + " to go."
      : "Up " + fmtW(-lost) + " since you started, " + fmtW(togo) + " to go.";
    card.appendChild(el("p", "", line));

    if (c.eta && c.weeks) {
      card.appendChild(el("p", "muted small",
        "At your current goal (about " + fmtW(c.weeklyKg, 2) + " per week) you could reach your target around " +
        longDate(c.eta) + " (about " + Math.ceil(c.weeks) + " weeks). Progress usually slows as you get lighter, so treat this as a rough guide."));
    }
    return card;
  }

  // ======================================================
  // WEEK
  // ======================================================
  var weekMetric = "calories";

  function weekData(offset) {
    var now = new Date();
    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var dow = (base.getDay() + 6) % 7;          // Monday = 0
    var monday = addDays(base, -dow + offset * 7);
    var tk = todayKey();
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(monday, i);
      var k = keyOf(d);
      var list = entries.filter(function (e) { return e.date === k; });
      var sw = list.filter(function (e) { return e.meal === "sweets"; });
      var wk = workouts.filter(function (x) { return x.date === k; });
      var exKcal = wk.reduce(function (s, x) { return s + x.kcal; }, 0);
      days.push({
        key: k, date: d, label: DAYS[i],
        kcal: sumCal(list), logged: list.length > 0, future: k > tk, today: k === tk,
        water: waterOn(k), waterTarget: waterTargetFor(k),
        sweets: sumCal(sw),
        sugar: sw.reduce(function (s, e) { return s + (e.sugar || 0); }, 0),
        exMin: wk.reduce(function (s, x) { return s + x.minutes; }, 0),
        exKcal: exKcal, exCount: wk.length,
        bonus: Math.round(exKcal * profile.eatBack)
      });
    }
    return { days: days, monday: monday, sunday: addDays(monday, 6) };
  }

  // Generic 7-bar chart. o = { line, minMax, fmtVal, cls(day, value), label }
  function barChart(days, valueOf, o) {
    var W = 320, H = 180, padT = 20, padB = 24, padX = 8;
    var maxV = 0;
    days.forEach(function (d) { var v = valueOf(d); if (v > maxV) maxV = v; });
    if (o.line && o.line > maxV) maxV = o.line;
    if (maxV < o.minMax) maxV = o.minMax;
    maxV *= 1.12;
    var plotH = H - padT - padB;
    var bw = (W - 2 * padX) / 7;
    var barW = bw * 0.62;

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H }, "chart");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", o.label);
    svg.appendChild(svgEl("line", { x1: padX, x2: W - padX, y1: H - padB, y2: H - padB }, "grid"));

    days.forEach(function (d, i) {
      var v = valueOf(d);
      var x = padX + i * bw + (bw - barW) / 2;
      var h = v / maxV * plotH;
      if (v > 0) {
        svg.appendChild(svgEl("rect", { x: x.toFixed(1), y: (H - padB - h).toFixed(1), width: barW.toFixed(1), height: Math.max(h, 1).toFixed(1), rx: 4 }, o.cls(d, v)));
        var t = svgEl("text", { x: (x + barW / 2).toFixed(1), y: (H - padB - h - 4).toFixed(1), "text-anchor": "middle" }, "val");
        t.textContent = o.fmtVal(v);
        svg.appendChild(t);
      }
      var lab = svgEl("text", { x: (padX + i * bw + bw / 2).toFixed(1), y: H - 8, "text-anchor": "middle" }, d.today ? "today-label" : "");
      lab.textContent = d.label;
      svg.appendChild(lab);
    });

    if (o.line) {
      var gy = H - padB - o.line / maxV * plotH;
      svg.appendChild(svgEl("line", { x1: padX, x2: W - padX, y1: gy.toFixed(1), y2: gy.toFixed(1) }, "goal"));
    }
    return svg;
  }

  function kvRows(card, rows) {
    rows.forEach(function (r) {
      var kv = el("div", "kv");
      kv.appendChild(el("span", "", r[0]));
      kv.appendChild(el("span", "", r[1]));
      card.appendChild(kv);
    });
  }

  function sumOf(list, fn) { return list.reduce(function (s, x) { return s + fn(x); }, 0); }

  function renderWeek() {
    var root = $("view-week");
    root.textContent = "";
    var c = calc();
    var wd = weekData(weekOffset);
    var days = wd.days;
    var elapsed = days.filter(function (d) { return !d.future; }).length;

    var head = el("header");
    head.appendChild(el("h1", "", "Week"));
    head.appendChild(el("p", "", "How your week is going"));
    root.appendChild(head);

    // Week navigation
    var nav = el("div", "weeknav");
    var prev = el("button", "", "‹");
    prev.type = "button";
    prev.setAttribute("aria-label", "Previous week");
    prev.addEventListener("click", function () { weekOffset--; shareLink = null; renderWeek(); });
    var next = el("button", "", "›");
    next.type = "button";
    next.setAttribute("aria-label", "Next week");
    next.disabled = weekOffset >= 0;
    next.addEventListener("click", function () { if (weekOffset < 0) { weekOffset++; shareLink = null; renderWeek(); } });
    var mid = el("div", "", shortDate(wd.monday) + " – " + shortDate(wd.sunday));
    mid.appendChild(el("small", "", weekOffset === 0 ? "This week" : (weekOffset === -1 ? "Last week" : Math.abs(weekOffset) + " weeks ago")));
    nav.appendChild(prev); nav.appendChild(mid); nav.appendChild(next);
    root.appendChild(nav);

    // Metric switch
    var mseg = el("div", "seg metric");
    mseg.style.margin = "8px 0";
    [["calories", "Calories"], ["water", "Water"], ["sweets", "Sweets"], ["exercise", "Exercise"]].forEach(function (m) {
      var b = el("button", weekMetric === m[0] ? "on" : "", m[1]);
      b.type = "button";
      b.addEventListener("click", function () { weekMetric = m[0]; renderWeek(); });
      mseg.appendChild(b);
    });
    root.appendChild(mseg);

    var chartCard = el("div", "card");
    var sum = el("div", "card");

    if (weekMetric === "water") {
      // ---------------- WATER ----------------
      var wBase = waterBase();
      chartCard.appendChild(el("h3", "", "Water per day (litres)"));
      chartCard.appendChild(barChart(days, function (d) { return d.water; }, {
        line: wBase, minMax: wBase,
        fmtVal: function (v) { return (v / 1000).toFixed(1); },
        cls: function (d, v) { return v >= d.waterTarget ? "bar-water" : "bar-water-dim"; },
        label: "Water drunk each day of the week"
      }));
      chartCard.appendChild(el("p", "muted small", "Dashed line = your daily target (" + fmtL(wBase) + ")." +
        (profile.waterAuto ? " On workout days your target is a little higher." : "") +
        " Bars are faded until you reach that day's target."));

      sum.appendChild(el("h3", "", "Water this week"));
      var wl = days.filter(function (d) { return d.water > 0; });
      if (wl.length === 0) {
        sum.appendChild(el("p", "muted", weekOffset === 0 ? "No water logged this week yet." : "No water was logged in this week."));
      } else {
        var wTotal = sumOf(wl, function (d) { return d.water; });
        var wAvg = Math.round(wTotal / wl.length);
        var wAvgTarget = Math.round(sumOf(wl, function (d) { return d.waterTarget; }) / wl.length);
        var wHit = wl.filter(function (d) { return d.water >= d.waterTarget; }).length;
        sum.appendChild(el("p", "", wAvg >= wAvgTarget
          ? "Great: you average " + fmtL(wAvg) + " a day, at or above your target."
          : "You average " + fmtL(wAvg) + " a day. Your target is about " + fmtL(wAvgTarget) + "."));
        kvRows(sum, [
          ["Days logged", wl.length + " of " + elapsed],
          ["Average per logged day", fmtL(wAvg) + " (" + glassesOf(wAvg) + " glasses)"],
          ["Target reached", wHit + " of " + wl.length + " logged days"],
          ["Total", fmtL(wTotal)]
        ]);
      }
    } else if (weekMetric === "sweets") {
      // ---------------- SWEETS ----------------
      var sLimit = sweetsLimit(c);
      chartCard.appendChild(el("h3", "", "Sweets per day (kcal)"));
      chartCard.appendChild(barChart(days, function (d) { return d.sweets; }, {
        line: sLimit, minMax: sLimit || 100, fmtVal: fmt,
        cls: function (d, v) { return sLimit && v > sLimit ? "bar-over" : "bar"; },
        label: "Calories from sweets each day of the week"
      }));
      chartCard.appendChild(el("p", "muted small", sLimit
        ? "Dashed line = your sweets limit (" + fmt(sLimit) + " kcal). Bars turn orange when you go over it."
        : "Set up your calorie goal in Settings to get a default sweets limit."));

      sum.appendChild(el("h3", "", "Sweets this week"));
      var fl = days.filter(function (d) { return d.logged; });
      if (fl.length === 0) {
        sum.appendChild(el("p", "muted", "No food logged this week yet."));
      } else {
        var sTot = sumOf(fl, function (d) { return d.sweets; });
        var kTot = sumOf(fl, function (d) { return d.kcal; });
        var sugTot = sumOf(fl, function (d) { return d.sugar; });
        var sAvg = sTot / fl.length;
        if (sTot === 0) sum.appendChild(el("p", "", "No sweets logged on your logged days."));
        else if (sLimit) sum.appendChild(el("p", "", sAvg <= sLimit
          ? "On average your sweets stay within your limit of " + fmt(sLimit) + " kcal a day."
          : "On average your sweets are above your limit of " + fmt(sLimit) + " kcal a day."));
        var sRows = [
          ["Sweets total", fmt(sTot) + " kcal"],
          ["Average per logged day", fmt(sAvg) + " kcal"],
          ["Share of your calories", (kTot > 0 ? Math.round(sTot / kTot * 100) : 0) + "%"]
        ];
        if (sugTot > 0) sRows.push(["Sugar logged", Math.round(sugTot) + " g"]);
        if (sLimit) sRows.push(["Days over your limit", fl.filter(function (d) { return d.sweets > sLimit; }).length + " of " + fl.length]);
        kvRows(sum, sRows);
        sum.appendChild(el("p", "muted small", "Sweets are also counted in your daily calories. Health guidance (WHO) suggests keeping free sugars below about 10% of daily calories, and BiteLog's default sweets limit follows that idea."));
      }
    } else if (weekMetric === "exercise") {
      // ---------------- EXERCISE ----------------
      chartCard.appendChild(el("h3", "", "Exercise per day (minutes)"));
      chartCard.appendChild(barChart(days, function (d) { return d.exMin; }, {
        line: null, minMax: 60, fmtVal: function (v) { return String(v); },
        cls: function () { return "bar"; },
        label: "Minutes of exercise each day of the week"
      }));
      chartCard.appendChild(el("p", "muted small", "Minutes of exercise per day."));

      sum.appendChild(el("h3", "", "Exercise this week"));
      var exCount = sumOf(days, function (d) { return d.exCount; });
      if (exCount === 0) {
        sum.appendChild(el("p", "muted", weekOffset === 0 ? "No workouts logged this week yet. Add one from the Today tab." : "No workouts were logged in this week."));
      } else {
        var exMin = sumOf(days, function (d) { return d.exMin; });
        var exKcal = sumOf(days, function (d) { return d.exKcal; });
        var exBonus = sumOf(days, function (d) { return d.bonus; });
        var active = days.filter(function (d) { return d.exMin > 0; }).length;
        var timeTxt = exMin >= 60 ? Math.floor(exMin / 60) + " h " + (exMin % 60) + " min" : exMin + " min";
        sum.appendChild(el("p", "", "You did " + exMin + " of the 150 minutes the weekly guide suggests."));
        kvRows(sum, [
          ["Workouts", String(exCount)],
          ["Active days", active + " of " + elapsed],
          ["Total time", timeTxt],
          ["Calories burned (estimate)", fmt(exKcal) + " kcal"],
          ["Added to your budgets", fmt(exBonus) + " kcal"]
        ]);
        sum.appendChild(el("p", "muted small", "Health guidance (WHO) suggests at least 150 minutes of moderate activity a week for adults. Calories burned are rough estimates."));
      }
    } else {
      // ---------------- CALORIES ----------------
      chartCard.appendChild(el("h3", "", "Calories per day"));
      chartCard.appendChild(barChart(days, function (d) { return d.kcal; }, {
        line: c ? c.goal : null, minMax: 1000, fmtVal: fmt,
        cls: function (d, v) { return c && v > c.goal + d.bonus ? "bar-over" : "bar"; },
        label: "Calories eaten each day of the week"
      }));
      chartCard.appendChild(el("p", "muted small", c
        ? "Dashed line = your daily goal (" + fmt(c.goal) + " kcal). Bars turn orange when you go over that day's budget (goal plus any exercise bonus)."
        : "Set up your profile in Settings to see your daily goal as a line."));

      var logged = days.filter(function (d) { return d.logged; });
      sum.appendChild(el("h3", "", "Week summary"));
      if (logged.length === 0) {
        sum.appendChild(el("p", "muted", weekOffset === 0 ? "No food logged this week yet. Add your first meal on the Today tab." : "No food was logged in this week."));
      } else {
        var total = sumOf(logged, function (d) { return d.kcal; });
        var avg = total / logged.length;
        var rows = [["Days logged", logged.length + " of " + elapsed], ["Average per logged day", fmt(avg) + " kcal"]];
        if (c) {
          var budgetSum = sumOf(logged, function (d) { return c.goal + d.bonus; });
          var diff = avg - budgetSum / logged.length;
          sum.appendChild(el("p", "", diff <= 0
            ? "Nice work: you are averaging " + fmt(-diff) + " kcal under your budget."
            : "You are averaging " + fmt(diff) + " kcal over your budget."));
          rows.push(["Eaten vs budget (logged days)", fmt(total) + " / " + fmt(budgetSum) + " kcal"]);
          var estKg = sumOf(logged, function (d) { return c.tdee + d.bonus - d.kcal; }) / 7700;
          rows.push(["Estimated change from calories", signed(-toDisp(estKg), 1) + " " + unitLabel()]);
        }
        kvRows(sum, rows);
        sum.appendChild(el("p", "muted small", "Days with nothing logged are not counted. The calorie estimate is rough: real weight also moves with water, salt and the time you weigh yourself."));
      }

      // Actual weigh-ins in this week
      var startKey = keyOf(wd.monday), endKey = keyOf(wd.sunday);
      var inWeek = weights.filter(function (w) { return w.date >= startKey && w.date <= endKey; });
      var before = null;
      weights.forEach(function (w) { if (w.date < startKey) before = w; });
      var wkv = el("div", "kv");
      wkv.appendChild(el("span", "", "Weight change (weigh-ins)"));
      if (inWeek.length === 0) {
        wkv.appendChild(el("span", "", "No weigh-in"));
      } else {
        var endW = inWeek[inWeek.length - 1];
        var startW = before || inWeek[0];
        if (startW.id === endW.id) wkv.appendChild(el("span", "", "Log one more"));
        else wkv.appendChild(el("span", "", signed(toDisp(endW.kg - startW.kg), 1) + " " + unitLabel()));
      }
      sum.appendChild(wkv);
    }

    root.appendChild(chartCard);
    root.appendChild(sum);
    root.appendChild(progressCard(c));
    root.appendChild(shareCard());
  }

  // WEIGHT

  function weightChart(c) {
    var W = 320, H = 200, padL = 40, padR = 12, padT = 14, padB = 26;
    var pts = weights.map(function (w) { return { t: parseKey(w.date).getTime(), v: toDisp(w.kg), d: w.date }; });
    var tv = profile.targetKg ? toDisp(profile.targetKg) : null;
    var vals = pts.map(function (p) { return p.v; });
    if (tv !== null) vals.push(tv);
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = max - min;
    if (span < 2) { var m = (max + min) / 2; min = m - 1; max = m + 1; }
    else { min -= span * 0.1; max += span * 0.1; }
    var t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    if (t1 === t0) t1 = t0 + 86400000;
    function x(t) { return padL + (t - t0) / (t1 - t0) * (W - padL - padR); }
    function y(v) { return padT + (max - v) / (max - min) * (H - padT - padB); }

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H }, "chart");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Weight trend over time");

    [min, (min + max) / 2, max].forEach(function (v) {
      var gy = y(v);
      svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: gy.toFixed(1), y2: gy.toFixed(1) }, "grid"));
      var tx = svgEl("text", { x: padL - 5, y: (gy + 3).toFixed(1), "text-anchor": "end" });
      tx.textContent = v.toFixed(profile.units === "lb" ? 0 : 1);
      svg.appendChild(tx);
    });

    if (tv !== null) {
      var ty = y(tv);
      svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: ty.toFixed(1), y2: ty.toFixed(1) }, "tgt"));
      var tl = svgEl("text", { x: W - padR, y: (ty - 4).toFixed(1), "text-anchor": "end" });
      tl.textContent = "Target " + tv.toFixed(1);
      svg.appendChild(tl);
    }

    svg.appendChild(svgEl("polyline", {
      points: pts.map(function (p) { return x(p.t).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ")
    }, "wline"));
    pts.forEach(function (p) {
      svg.appendChild(svgEl("circle", { cx: x(p.t).toFixed(1), cy: y(p.v).toFixed(1), r: 3.2 }, "dot"));
    });

    var l1 = svgEl("text", { x: padL, y: H - 6, "text-anchor": "start" });
    l1.textContent = shortDate(parseKey(pts[0].d));
    var l2 = svgEl("text", { x: W - padR, y: H - 6, "text-anchor": "end" });
    l2.textContent = shortDate(parseKey(pts[pts.length - 1].d));
    svg.appendChild(l1); svg.appendChild(l2);
    return svg;
  }

      : (kg + " kg");

  // ======================================================
  // Water, sweets and exercise
  // ======================================================
  function waterOn(key) { return water[key] || 0; }
  function fmtL(ml) { return (ml / 1000).toFixed(ml % 100 === 0 ? 1 : 2) + " L"; }
  function glassesOf(ml) { return String(Math.round(ml / profile.glassMl * 10) / 10); }

  // Daily water target: ml per kg of body weight (limited to a sensible range)
  function autoWaterMl(perKg) {
    var lw = latestWeight();
    if (!lw) return null;
    var ml = Math.min(4000, Math.max(1500, lw.kg * perKg));
    return Math.round(ml / 50) * 50;
  }
  function waterBase() {
    if (profile.waterAuto) {
      var a = autoWaterMl(profile.waterPerKg);
      if (a) return a;
    }
    return profile.waterMl;
  }
  // About 0.5 L extra per hour of exercise (automatic mode only)
  function waterExtra(key) {
    if (!profile.waterAuto || !autoWaterMl(profile.waterPerKg)) return 0;
    var mins = workoutsOn(key).reduce(function (s, w) { return s + w.minutes; }, 0);
    return Math.round(mins * 500 / 60 / 50) * 50;
  }
  function waterTargetFor(key) { return waterBase() + waterExtra(key); }

  function addWater(ml) {
    var k = todayKey();
    var before = waterOn(k);
    var after = Math.min(20000, Math.max(0, before + ml));
    if (after === 0) delete water[k]; else water[k] = after;
    save(KEYS.water, water);
    renderAll();
    var wGoal = waterTargetFor(k);
    if (ml > 0 && before < wGoal && after >= wGoal) toast("Water goal reached 💧");
  }

  function sweetsLimit(c) {
    if (profile.sweetsLimit) return profile.sweetsLimit;
    return c ? round10(c.goal * 0.10) : null;
  }

  function activityById(id) {

  // Extra calories burned above resting: (MET - 1) x weight(kg) x hours

  }
  function workoutsOn(key) { return workouts.filter(function (w) { return w.date === key; }); }
  function burnedOn(key) { return workoutsOn(key).reduce(function (s, w) { return s + w.kcal; }, 0); }
  function bonusOn(key) { return Math.round(burnedOn(key) * profile.eatBack); }

  function buildShareText() {

  // ---- Snapshot (the data that goes inside a share link) ----
  function buildSnapshot() {
    var wd = weekData(weekOffset), c = calc();
    var snap = { v: 1, n: (profile.shareName || "").slice(0, 40), m: keyOf(wd.monday), g: c ? c.goal : null, d: [] };
    if (shareOpts.extra) snap.wt = waterBase();

      var day = { k: d.kcal, b: d.bonus };
      if (shareOpts.food) {

          .map(function (e) { return [e.meal, e.name.slice(0, 60), e.calories]; });
      }
      if (shareOpts.extra) {

      }
      snap.d.push(day);
    });

  // Validates untrusted data from a link and returns a clean copy (or null)
  function cleanSnapshot(o) {

    if (typeof o.m !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(o.m) || keyOf(parseKey(o.m)) !== o.m) return null;

  // ---- Encoding: JSON -> (deflate) -> base64url ----
  function b64urlEncode(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);

  function b64urlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    var bin = atob(str);

    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

  function inflateBounded(bytes, limit) {

    var chunks = [], total = 0;

          chunks.forEach(function (c) { out.set(c, pos); pos += c.length; });
          return out;
        }
        total += r.value.length;
        if (total > limit) { try { reader.cancel(); } catch (e) {} throw new Error("too big"); }
        chunks.push(r.value);
        return pump();
      });
    }

      if (!snap) throw new Error("invalid");
      renderSharedView(snap);
    }).catch(function () { renderSharedError(); });
  }

  function openOwnApp() {
    var b = el("button", "btn secondary", "Open my own BiteLog");
    b.type = "button";
    b.addEventListener("click", function () { location.href = location.pathname; });
    return b;
  }

  function renderSharedError() {
    var root = $("view-shared");
    root.textContent = "";
    var head = el("header");
    head.appendChild(el("h1", "", "BiteLog"));
    root.appendChild(head);
    var card = el("div", "card");
    card.appendChild(el("p", "", "This shared link could not be opened. It may be damaged, cut off by a chat app, or too new for this browser."));
    card.appendChild(el("p", "muted small", "Ask your friend to send it again, or to use Share as text instead."));
    card.appendChild(openOwnApp());
    root.appendChild(card);
  }

  function renderSharedView(snap) {
    var root = $("view-shared");
    root.textContent = "";
    var monday = parseKey(snap.monday);
    var days = snap.days.map(function (x, i) {
      var dt = addDays(monday, i);
      return {
        key: keyOf(dt), date: dt, label: DAYS[i], today: false, x: x,
        kcal: x.kcal, bonus: x.bonus, logged: x.kcal > 0 || !!(x.food && x.food.length)
      };
    });
    var goal = snap.goal;

    var head = el("header");
    head.appendChild(el("h1", "", snap.name ? snap.name + "'s week" : "A friend's week"));
    head.appendChild(el("p", "", shortDate(monday) + " – " + shortDate(addDays(monday, 6)) + " · shared from BiteLog"));
    root.appendChild(head);

    var chartCard = el("div", "card");
    chartCard.appendChild(el("h3", "", "Calories per day"));
    chartCard.appendChild(barChart(days, function (d) { return d.kcal; }, {
      line: goal, minMax: 1000, fmtVal: fmt,
      cls: function (d, v) { return goal && v > goal + d.bonus ? "bar-over" : "bar"; },
      label: "Calories eaten each day of the week"
    }));
    chartCard.appendChild(el("p", "muted small", goal
      ? "Dashed line = daily calorie goal (" + fmt(goal) + " kcal). Orange bars are over that day's budget."
      : "Calories eaten each day."));
    root.appendChild(chartCard);

    var logged = days.filter(function (d) { return d.logged; });
    var sum = el("div", "card");
    sum.appendChild(el("h3", "", "Summary"));
    if (logged.length === 0) {
      sum.appendChild(el("p", "muted", "Nothing was logged in this week."));
    } else {
      var total = sumOf(logged, function (d) { return d.kcal; });
      var avg = total / logged.length;
      var rows = [["Days logged", logged.length + " of 7"], ["Average per logged day", fmt(avg) + " kcal"]];
      if (goal) {
        var avgBudget = goal + sumOf(logged, function (d) { return d.bonus; }) / logged.length;
        rows.push(["Daily goal", fmt(goal) + " kcal"]);
        var diff = avg - avgBudget;
        sum.appendChild(el("p", "", diff <= 0
          ? "On average " + fmt(-diff) + " kcal under the daily budget."
          : "On average " + fmt(diff) + " kcal over the daily budget."));
      }
      kvRows(sum, rows);
    }
    root.appendChild(sum);

    var hasFood = days.some(function (d) { return d.x.food !== null; });
    var hasExtra = days.some(function (d) { return d.x.water !== null; });

    if ((hasFood || hasExtra) && logged.length) {
      var dayCard = el("div", "card");
      dayCard.appendChild(el("h3", "", hasFood ? "What was eaten" : "Day by day"));
      days.forEach(function (d) {
        var x = d.x;
        var bits = [];
        if (x.water) bits.push("Water " + fmtL(x.water));
        if (x.ex) x.ex.forEach(function (e) { bits.push(activityById(e.type).label + " " + e.min + " min"); });
        if (!d.logged && bits.length === 0) return;
        var box = el("div", "sday");
        var h = el("div", "sday-head");
        h.appendChild(el("span", "", dayLabel(d.date)));
        h.appendChild(el("span", "", fmt(d.kcal) + " kcal"));
        box.appendChild(h);
        if (x.food) {
          MEALS.forEach(function (m) {
            var items = x.food.filter(function (f) { return f.meal === m.id; });
            if (!items.length) return;
            var line = el("div", "smeal");
            line.appendChild(el("b", "", m.label + ": "));
            line.appendChild(document.createTextNode(items.map(function (f) { return f.name + " (" + f.kcal + ")"; }).join(", ")));
            box.appendChild(line);
          });
        }
        if (bits.length) box.appendChild(el("div", "smeal", bits.join(" · ")));
        dayCard.appendChild(box);
      });
      root.appendChild(dayCard);
    }

    if (hasExtra) {
      var xc = el("div", "card");
      xc.appendChild(el("h3", "", "Water and exercise"));
      var wl = days.filter(function (d) { return d.x.water > 0; });
      var rowsX = [];
      if (wl.length) {
        var wAvg = Math.round(sumOf(wl, function (d) { return d.x.water; }) / wl.length);
        rowsX.push(["Average water per logged day", fmtL(wAvg)]);
        var hit = wl.filter(function (d) { return d.x.wTarget && d.x.water >= d.x.wTarget; }).length;
        if (wl.some(function (d) { return d.x.wTarget; })) rowsX.push(["Water target reached", hit + " of " + wl.length + " logged days"]);
      } else rowsX.push(["Water", "Nothing logged"]);
      var exMin = sumOf(days, function (d) { return d.x.ex ? sumOf(d.x.ex, function (e) { return e.min; }) : 0; });
      var exKcal = sumOf(days, function (d) { return d.x.ex ? sumOf(d.x.ex, function (e) { return e.kcal; }) : 0; });
      rowsX.push(["Exercise", exMin > 0 ? exMin + " min (about " + fmt(exKcal) + " kcal)" : "None logged"]);
      kvRows(xc, rowsX);
      root.appendChild(xc);
    }

    if (snap.weight) {
      var wg = snap.weight;
      var wc = el("div", "card");
      wc.appendChild(el("h3", "", "Weight progress"));
      var pct = wg.s > wg.t ? Math.max(0, Math.min(100, (wg.s - wg.n) / (wg.s - wg.t) * 100)) : 100;
      var track = el("div", "track");
      var fill = el("div", "fill");
      fill.style.width = pct.toFixed(0) + "%";
      track.appendChild(fill);
      wc.appendChild(track);
      var triple = el("div", "triple");
      [["Start", wg.s], ["Now", wg.n], ["Target", wg.t]].forEach(function (t) {
        var d = el("div");
        d.appendChild(el("b", "", t[1].toFixed(1) + " " + wg.u));
        d.appendChild(document.createTextNode(t[0]));
        triple.appendChild(d);
      });
      wc.appendChild(triple);
      root.appendChild(wc);
    }

    var note = el("div", "card");
    note.appendChild(el("p", "muted small", "This is a read-only snapshot. Everything you see is stored inside the link, not on a server. BiteLog is a tracking tool, not medical advice."));
    note.appendChild(openOwnApp());
    root.appendChild(note);
  }

  // ======================================================
  // Backup, restore and clearing data
  // ======================================================
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function dataStats() {
    var bytes = JSON.stringify(entries).length + JSON.stringify(weights).length + JSON.stringify(profile).length +
      JSON.stringify(workouts).length + JSON.stringify(water).length;
    return {
      entries: entries.length, weights: weights.length,
      workouts: workouts.length, waterDays: Object.keys(water).length,
      kb: bytes / 1024
    };
  }

  function needsBackup() {
    if (entries.length + weights.length + workouts.length < 5) return false;
    if (!profile.lastBackup) return true;
    var t = Date.parse(profile.lastBackup);
    if (isNaN(t)) return true;
    return (Date.now() - t) / 86400000 >= 14;
  }

  function buildBackup() {
    return {
      app: "bitelog", version: 2, exportedAt: new Date().toISOString(),
      profile: profile, entries: entries, weights: weights, workouts: workouts, water: water
    };
  }

  function markBackup() {
    profile.lastBackup = new Date().toISOString();
    saveProfile();
    var lb = $("lastBackupVal");
    if (lb) lb.textContent = longDate(new Date(profile.lastBackup));
    renderToday();
  }

  function downloadText(name, text) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function exportBackup() {
    var json = JSON.stringify(buildBackup());
    var name = "bitelog-backup-" + todayKey() + ".json";
    var file = null;
    try { file = new File([json], name, { type: "application/json" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "BiteLog backup" }).then(function () {
        markBackup();
        toast("Backup shared. Make sure you chose Save to Files.");
      }).catch(function (e) {
        if (e && e.name === "AbortError") return;      // user closed the share sheet
        downloadText(name, json);
        markBackup();
        toast("Backup downloaded. Look in your Files app.");
      });
    } else {
      downloadText(name, json);
      markBackup();
      toast("Backup downloaded. Look in your Files app.");
    }
  }

  // Checks a backup file and keeps only valid data
  function cleanBackup(obj) {
    if (!obj || typeof obj !== "object" || obj.app !== "bitelog") return null;
    var okDate = /^\d{4}-\d{2}-\d{2}$/;
    var mealIds = MEALS.map(function (m) { return m.id; });
    function optNum(v) { return (typeof v === "number" && isFinite(v) && v >= 0) ? v : null; }
    function inRange(v, lo, hi) { return (typeof v === "number" && isFinite(v) && v >= lo && v <= hi) ? v : null; }
    function uniqueId(raw, seen) {
      var id = (typeof raw === "string" && raw) ? raw.slice(0, 40) : newId();
      while (seen[id]) id = newId();
      seen[id] = true;
      return id;
    }

    var seenE = {};
    var es = (Array.isArray(obj.entries) ? obj.entries : []).filter(function (e) {
      return e && typeof e.name === "string" && typeof e.date === "string" && okDate.test(e.date) &&
        mealIds.indexOf(e.meal) !== -1 && typeof e.calories === "number" && isFinite(e.calories) &&
        e.calories >= 0 && e.calories <= 20000;
    }).map(function (e) {
      return {
        id: uniqueId(e.id, seenE), date: e.date, meal: e.meal,
        name: e.name.slice(0, 200),
        portion: typeof e.portion === "string" ? e.portion.slice(0, 100) : "",
        calories: Math.round(e.calories),
        protein: optNum(e.protein), carbs: optNum(e.carbs), fat: optNum(e.fat),
        sugar: optNum(e.sugar)
      };
    });

    var seenW = {}, seenDay = {};
    var ws = (Array.isArray(obj.weights) ? obj.weights : []).filter(function (w) {
      return w && typeof w.date === "string" && okDate.test(w.date) &&
        typeof w.kg === "number" && isFinite(w.kg) && w.kg >= 30 && w.kg <= 300;
    }).filter(function (w) {
      if (seenDay[w.date]) return false;
      seenDay[w.date] = true;
      return true;
    }).map(function (w) { return { id: uniqueId(w.id, seenW), date: w.date, kg: w.kg }; });

    var actIds = ACTIVITIES.map(function (a) { return a.id; });
    var seenX = {};
    var xs = (Array.isArray(obj.workouts) ? obj.workouts : []).filter(function (x) {
      return x && typeof x.date === "string" && okDate.test(x.date) &&
        typeof x.minutes === "number" && isFinite(x.minutes) && x.minutes >= 1 && x.minutes <= 600 &&
        typeof x.kcal === "number" && isFinite(x.kcal) && x.kcal >= 0 && x.kcal <= 5000;
    }).map(function (x) {
      return {
        id: uniqueId(x.id, seenX), date: x.date,
        type: actIds.indexOf(x.type) !== -1 ? x.type : "other",
        minutes: Math.round(x.minutes), kcal: Math.round(x.kcal)
      };
    });

    var wat = {};
    if (obj.water && typeof obj.water === "object" && !Array.isArray(obj.water)) {
      Object.keys(obj.water).forEach(function (k) {
        var v = obj.water[k];
        if (okDate.test(k) && typeof v === "number" && isFinite(v) && v > 0 && v <= 20000) wat[k] = Math.round(v);
      });
    }

    var p = (obj.profile && typeof obj.profile === "object") ? obj.profile : {};
    var prof = {
      sex: (p.sex === "f" || p.sex === "m") ? p.sex : null,
      age: inRange(p.age, 10, 100),
      heightCm: inRange(p.heightCm, 100, 250),
      targetKg: inRange(p.targetKg, 30, 300),
      activity: [1.2, 1.375, 1.55, 1.725].indexOf(p.activity) !== -1 ? p.activity : 1.2,
      pace: [0.25, 0.5, 0.75].indexOf(p.pace) !== -1 ? p.pace : 0.5,
      customGoal: inRange(p.customGoal, 500, 6000),
      units: p.units === "lb" ? "lb" : "kg",
      glassMl: [200, 250, 300, 330, 500].indexOf(p.glassMl) !== -1 ? p.glassMl : 250,
      waterMl: inRange(p.waterMl, 500, 6000) || 2000,
      sweetsLimit: inRange(p.sweetsLimit, 20, 2000),
      eatBack: [0, 0.5, 1].indexOf(p.eatBack) !== -1 ? p.eatBack : 0.5,
      waterAuto: p.waterAuto === false ? false : true,
      waterPerKg: [30, 35, 40].indexOf(p.waterPerKg) !== -1 ? p.waterPerKg : 35,
      shareName: typeof p.shareName === "string" ? p.shareName.slice(0, 40) : "",
      lastBackup: (typeof obj.exportedAt === "string" && !isNaN(Date.parse(obj.exportedAt))) ? new Date(obj.exportedAt).toISOString() : null
    };
    return { entries: es, weights: ws, workouts: xs, water: wat, profile: prof };
  }

  function importBackup(inputEl) {
    var f = inputEl.files && inputEl.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { inputEl.value = ""; toast("That file is too big to be a BiteLog backup.", true); return; }
    var r = new FileReader();
    r.onerror = function () { inputEl.value = ""; toast("Could not read that file.", true); };
    r.onload = function () {
      inputEl.value = "";
      var obj = null;
      try { obj = JSON.parse(String(r.result)); } catch (e) { obj = null; }
      var c = cleanBackup(obj);
      if (!c) { toast("That does not look like a BiteLog backup file.", true); return; }
      var msg = "Restore this backup?\n\n" + c.entries.length + " food entries and " + c.weights.length + " weights" +
        (c.workouts.length ? ", " + c.workouts.length + " workouts" : "") +
        (c.profile.lastBackup ? ", saved on " + longDate(new Date(c.profile.lastBackup)) : "") +
        ".\n\nThis REPLACES everything currently on this phone.";
      if (!confirm(msg)) return;
      entries = c.entries;
      weights = c.weights;
      workouts = c.workouts;
      water = c.water;
      sortWeights();
      profile = Object.assign(defaultProfile(), c.profile);
      save(KEYS.entries, entries);
      save(KEYS.weights, weights);
      save(KEYS.workouts, workouts);
      save(KEYS.water, water);
      saveProfile();
      weekOffset = 0;
      toast("Backup restored");
      switchTo(profileReady() ? "today" : "settings");
    };
    r.readAsText(f);
  }

  function deleteOlder(days) {
    var cutoff = keyOf(addDays(new Date(), -days));
    var oldE = entries.filter(function (e) { return e.date < cutoff; });
    var oldX = workouts.filter(function (x) { return x.date < cutoff; });
    var oldW = Object.keys(water).filter(function (k) { return k < cutoff; });
    if (oldE.length + oldX.length + oldW.length === 0) { toast("Nothing older than that to delete."); return; }
    var parts = [fmt(oldE.length) + " food entries"];
    if (oldX.length) parts.push(fmt(oldX.length) + " workouts");
    if (oldW.length) parts.push(fmt(oldW.length) + " days of water logs");
    if (!confirm("Delete " + parts.join(", ") + " from before " + longDate(parseKey(cutoff)) +
      "?\n\nYour weights and profile are kept. Tip: save a backup first. This cannot be undone.")) return;
    entries = entries.filter(function (e) { return e.date >= cutoff; });
    workouts = workouts.filter(function (x) { return x.date >= cutoff; });
    oldW.forEach(function (k) { delete water[k]; });
    save(KEYS.entries, entries);
    save(KEYS.workouts, workouts);
    save(KEYS.water, water);
    toast("Old logs deleted");
    renderSettings();
    renderAll();
  }

  function deleteAllFood() {
    if (entries.length === 0) { toast("There are no food entries to delete."); return; }
    if (!confirm("Delete all " + fmt(entries.length) + " food entries?\n\nYour weights and profile are kept. Tip: save a backup first. This cannot be undone.")) return;
    entries = [];
    save(KEYS.entries, entries);
    toast("Food entries deleted");
    renderSettings();
    renderAll();
  }

  // ======================================================
  // Add-food sheet
  // ======================================================
  var overlay = $("overlay");
  var form = $("form");
  var fName = $("fName"), fPortion = $("fPortion"), fCal = $("fCal");
  var fProtein = $("fProtein"), fCarbs = $("fCarbs"), fFat = $("fFat");
  var saveBtn = $("saveBtn");
  var currentMeal = null;

  function validate() {
    var okName = fName.value.trim() !== "";
    var okCal = /^\d+$/.test(fCal.value.trim());
    saveBtn.disabled = !(okName && okCal);
  }
  [fName, fCal].forEach(function (i) { i.addEventListener("input", validate); });

  function openSheet(meal) {
    currentMeal = meal;
    $("sheetTitle").textContent = "Add to " + meal.label;
    form.reset();
    $("sugarWrap").hidden = meal.id !== "sweets";
    $("macroWrap").hidden = meal.id === "sweets";
    validate();
    overlay.classList.add("open");
    setTimeout(function () { fName.focus(); }, 50);
  }
  function closeSheet() { overlay.classList.remove("open"); }
  $("cancelBtn").addEventListener("click", closeSheet);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (saveBtn.disabled) return;
    entries.push({
      id: newId(),
      date: todayKey(),
      meal: currentMeal.id,
      name: fName.value.trim(),
      portion: fPortion.value.trim(),
      calories: parseInt(fCal.value.trim(), 10),
      protein: numOrNull(fProtein.value),
      carbs: numOrNull(fCarbs.value),
      fat: numOrNull(fFat.value),
      sugar: currentMeal.id === "sweets" ? numOrNull($("fSugar").value) : null
    });
    save(KEYS.entries, entries);
    closeSheet();
    renderAll();
  });

  // Refresh when the app returns to the foreground (e.g. after midnight)
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !sharedMode) renderAll();
  });

  // ======================================================
  // Start
  // ======================================================
  var sharedMatch = /^#s=([zj]\.[A-Za-z0-9_-]{1,60000})$/.exec(location.hash || "");
  if (sharedMatch) {
    startSharedView(sharedMatch[1]);       // a friend's read-only snapshot: never touches local data
  } else {
    renderAll();
    switchTo(profileReady() ? "today" : "settings");
  }

  // Ask the browser to keep this app's data safe from automatic clean-up
  try {
    if (navigator.storage && navigator.storage.persist) {
      var pp = navigator.storage.persist();
      if (pp && pp.catch) pp.catch(function () {});
    }
  } catch (e) {}

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
